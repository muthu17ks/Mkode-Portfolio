<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Message</title>
</head>

<body style="
    margin:0;
    padding:0;
    background-color:#f2f4f7;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
<tr>
<td align="center">

<table width="100%" cellpadding="0" cellspacing="0" style="
    max-width:650px;
    background-color:#ffffff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 12px 32px rgba(0,0,0,0.08);
">

    <tr>
        <td style="
            padding:28px 24px;
            background-color:#0f172a;
            color:#ffffff;
        ">
            <h2 style="
                margin:0;
                font-size:20px;
                font-weight:600;
                letter-spacing:0.3px;
            ">
                New Portfolio Message Received
            </h2>
            <p style="
                margin:8px 0 0;
                font-size:13px;
                color:#c7c9d1;
                line-height:1.5;
            ">
                Notification of a message submitted through your portfolio website
            </p>
        </td>
    </tr>

    <tr>
        <td style="padding:32px 24px; color:#1f2937;">

            <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
                <tr>
                    <td style="
                        padding:12px 0;
                        font-size:12px;
                        color:#6b7280;
                        width:110px;
                        border-bottom:1px solid #e5e7eb;
                        letter-spacing:0.5px;
                    ">
                        SENDER
                    </td>
                    <td style="
                        padding:12px 0;
                        font-size:15px;
                        font-weight:600;
                        color:#0f172a;
                        border-bottom:1px solid #e5e7eb;
                        word-break:break-word;
                    ">
                        {{ name }}
                    </td>
                </tr>
                <tr>
                    <td style="
                        padding:12px 0;
                        font-size:12px;
                        color:#6b7280;
                        border-bottom:1px solid #e5e7eb;
                        letter-spacing:0.5px;
                    ">
                        EMAIL
                    </td>
                    <td style="
                        padding:12px 0;
                        font-size:15px;
                        color:#2563eb;
                        border-bottom:1px solid #e5e7eb;
                        word-break:break-word;
                    ">
                        {{ email }}
                    </td>
                </tr>
                <tr>
                    <td style="
                        padding:12px 0;
                        font-size:12px;
                        color:#6b7280;
                        border-bottom:1px solid #e5e7eb;
                        letter-spacing:0.5px;
                    ">
                        RECEIVED
                    </td>
                    <td style="
                        padding:12px 0;
                        font-size:15px;
                        color:#0f172a;
                        border-bottom:1px solid #e5e7eb;
                    ">
                        {{ current_time }}
                    </td>
                </tr>
            </table>

            <div style="
                font-size:12px;
                color:#6b7280;
                letter-spacing:0.5px;
                margin-bottom:10px;
            ">
                MESSAGE CONTENT
            </div>

            <div style="
                font-size:16px;
                line-height:1.7;
                color:#1f2937;
                background-color:#f9fafb;
                border:1px solid #e5e7eb;
                padding:20px;
                border-radius:10px;
                white-space:pre-line;
                word-break:break-word;
            ">
{{ message }}
            </div>

            <div style="margin-top:32px; text-align:center;">
                <a href="mailto:{{ email }}" style="
                    display:inline-block;
                    padding:14px 32px;
                    background-color:#0f172a;
                    color:#ffffff;
                    text-decoration:none;
                    font-size:14px;
                    font-weight:600;
                    border-radius:999px;
                    letter-spacing:0.3px;
                ">
                    Reply to Sender
                </a>
            </div>

        </td>
    </tr>

    <tr>
        <td style="
            padding:18px 24px;
            background-color:#f8fafc;
            border-top:1px solid #e5e7eb;
            text-align:center;
            font-size:12px;
            color:#6b7280;
            line-height:1.5;
        ">
            This notification was generated automatically from your portfolio website.
        </td>
    </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
