<header class="navbar" role="banner">

  {# 1. Define variables to check current page #}
  {% set is_home = request.endpoint == 'portfolio.home' %}
  {% set home_url = url_for('portfolio.home') %}

  <a href="{{ home_url }}" class="navbar__logo" aria-label="Return to Home">
    <img
      src="{{ url_for('portfolio.static', filename='images/logo-Mkode-icon.png') }}"
      alt="Mkode Logo"
      width="40"
      height="40"
      class="navbar__logo-img"
    >
  </a>

  <div class="navbar__center-group">

    <button id="mobile-menu-btn" class="navbar__mobile-toggle" aria-label="Toggle Navigation Menu" aria-expanded="false">
      <span class="btn-text">Menu</span>
    </button>

    <nav id="navbar-menu" class="navbar__menu" aria-label="Main Navigation">
      <a href="{{ '#main' if is_home else home_url ~ '#main' }}" class="nav-link">Home</a>
      <a href="{{ '#about' if is_home else home_url ~ '#about' }}" class="nav-link">About</a>
      <a href="{{ '#projects' if is_home else home_url ~ '#projects' }}" class="nav-link">Projects</a>
      <a href="{{ '#awards' if is_home else home_url ~ '#awards' }}" class="nav-link">Awards</a>
      <a href="{{ '#contact' if is_home else home_url ~ '#contact' }}" class="nav-link">Contact</a>
    </nav>

    <button id="cp-trigger" class="navbar__glass-btn search-btn" aria-label="Search Commands (Cmd+K)">
      <i data-lucide="command" class="icon-desktop"></i>
      <i data-lucide="search" class="icon-mobile"></i>
      <span class="btn-text-mobile">Search</span>
    </button>

    <button id="theme-toggle" class="navbar__theme-toggle" aria-label="Switch Color Theme">
      <i data-lucide="sun" aria-hidden="true"></i>
    </button>
  </div>

  <a href="{{ '#contact' if is_home else home_url ~ '#contact' }}" class="navbar__cta">Hire Me</a>

</header>

<div id="cp-modal" class="cp-modal" aria-hidden="true">
  <div class="cp-backdrop"></div>
  <div class="cp-container">
    <div class="cp-header">
      <div class="cp-input-group">
        <i data-lucide="search" class="cp-search-icon"></i>
        <input type="text" id="cp-input" placeholder="Type a command or search..." autocomplete="off">
      </div>
      <div class="cp-header-actions">
        <button class="cp-action-btn" id="cp-theme-btn" aria-label="Toggle Theme">
          <i data-lucide="sun"></i>
        </button>
        <button class="cp-action-btn" id="cp-close-btn"><i data-lucide="x"></i></button>
      </div>
    </div>

    <div class="cp-body" id="cp-results">
      </div>

    <div class="cp-footer">
      <div class="cp-hint-group desktop-only">
        <span class="cp-key"><i data-lucide="arrow-up" style="width:10px;"></i></span>
        <span class="cp-key"><i data-lucide="arrow-down" style="width:10px;"></i></span>
        <span>to navigate</span>
      </div>
      <div class="cp-hint-group desktop-only">
        <span class="cp-key">↵</span>
        <span>to select</span>
      </div>
       <div class="cp-hint-group desktop-only">
        <span class="cp-key">Esc</span>
        <span>to close</span>
      </div>
    </div>
  </div>
</div>
